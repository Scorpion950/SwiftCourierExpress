{% macro tracking_timeline(history) %}
  <div class="timeline">
    {% for item in history %}
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-content">
          <div class="timeline-topline">
            <span class="timeline-date">{{ item.timestamp.strftime('%d %b %Y, %H:%M') }}</span>
            <span class="status-pill status-{{ item.status|replace(' ', '-')|lower }}">{{ item.status }}</span>
          </div>
          <p>{{ item.remark or 'Status updated' }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
{% endmacro %}
